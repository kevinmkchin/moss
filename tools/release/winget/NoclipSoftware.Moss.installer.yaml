# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.10.0.schema.json
PackageIdentifier: NoclipSoftware.Moss
PackageVersion: {{VERSION}}
InstallerType: zip
NestedInstallerType: portable
NestedInstallerFiles:
- RelativeFilePath: moss.exe
  PortableCommandAlias: moss
# moss runs the console host, clink and its shell setup from its own folder: winget puts that folder on PATH
# instead of linking moss.exe alone
ArchiveBinariesDependOnPath: true
MinimumOSVersion: 10.0.17763.0
Commands:
- moss
ReleaseDate: {{DATE}}
Installers:
- Architecture: x64
  InstallerUrl: {{URL}}
  InstallerSha256: {{SHA256}}
ManifestType: installer
ManifestVersion: 1.10.0
